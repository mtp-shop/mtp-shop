<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful | TPS TEMPLE</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="theme-color" content="#050505">
    
    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;1,900&family=Poppins:wght@300;400;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #050505;
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-success: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.3);
            --text-main: #ffffff;
            --font-head: 'Montserrat', sans-serif;
            --font-body: 'Poppins', sans-serif;
            --font-tech: 'Space Mono', monospace; 
        }

        body {
            margin: 0; font-family: var(--font-body); color: var(--text-main);
            background-color: #050505;
            background-image: linear-gradient(to bottom, rgba(0,0,0,0.85), rgba(0,0,0,0.98)), url('background.png'); 
            background-size: cover; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .success-card {
            max-width: 600px; width: 90%;
            background: rgba(10, 10, 10, 0.6); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 50px 40px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            animation: slideUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes slideUp { 0% { opacity: 0; transform: translateY(40px) scale(0.95); } 100% { opacity: 1; transform: translateY(0) scale(1); } }

        .check-icon {
            width: 90px; height: 90px;
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid var(--accent-success);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            margin: 0 auto 30px;
            box-shadow: 0 0 30px var(--accent-glow);
            animation: pulseSuccess 2s infinite;
        }
        @keyframes pulseSuccess { 0% { box-shadow: 0 0 20px var(--accent-glow); } 50% { box-shadow: 0 0 40px var(--accent-glow); } 100% { box-shadow: 0 0 20px var(--accent-glow); } }
        .check-icon i { font-size: 2.5rem; color: var(--accent-success); }

        h1 {
            font-family: var(--font-head); font-weight: 900; font-style: italic;
            font-size: 2.8rem; margin: 0 0 10px 0; text-transform: uppercase;
            letter-spacing: -1px;
            background: linear-gradient(to right, #ffffff, #888888);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .status-msg { color: #888; margin-bottom: 30px; font-size: 1.1rem; }

        /* RECEIPT BOX */
        .order-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px; padding: 25px;
            margin-bottom: 40px; text-align: left;
        }
        .summary-header {
            font-family: var(--font-tech); color: #555;
            font-size: 0.75rem; text-transform: uppercase;
            letter-spacing: 2px; border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 10px; margin-bottom: 15px;
            display: flex; justify-content: space-between;
        }
        .order-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.95rem; }
        .item-name { font-weight: 700; color: #eee; font-family: var(--font-head); font-style: italic; }
        .item-price { font-family: var(--font-tech); color: var(--accent-success); }
        .total-row {
            margin-top: 15px; padding-top: 15px;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
            display: flex; justify-content: space-between;
            font-family: var(--font-head); font-weight: 900; font-size: 1.2rem;
        }

        .discord-btn {
            display: inline-flex; align-items: center; gap: 12px;
            background: var(--accent-success); color: #000;
            text-decoration: none; padding: 18px 40px;
            border-radius: 50px; font-family: var(--font-head);
            font-weight: 900; font-style: italic; text-transform: uppercase;
            transition: 0.3s cubic-bezier(0.19, 1, 0.22, 1);
            box-shadow: 0 10px 30px var(--accent-glow);
        }
        .discord-btn:hover { background: #ffffff; transform: translateY(-5px) scale(1.02); box-shadow: 0 15px 40px rgba(255,255,255,0.2); }
        .back-link { display: block; margin-top: 25px; color: #444; text-decoration: none; font-size: 0.85rem; font-weight: 700; transition: 0.2s; }
        .back-link:hover { color: #888; }
        .confetti { position: fixed; width: 10px; height: 10px; background-color: var(--accent-success); top: -10px; z-index: 9999; pointer-events: none; animation: fall 3s linear forwards; }
        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); opacity: 0; } }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="check-icon"><i class="fas fa-check"></i></div>
        <h1>PAYMENT SUCCESS</h1>
        <p class="status-msg">Your transaction was completed successfully.</p>

        <div class="order-box">
            <div class="summary-header">
                <span>Items Purchased</span>
                <span id="orderDate">00/00/0000</span>
            </div>
            <div id="itemsContainer">
                <!-- Javascript will put items here -->
            </div>
            <div class="total-row">
                <span>TOTAL PAID</span>
                <span id="orderTotal">£0.00</span>
            </div>
            <div id="orderIdDisplay" style="margin-top:10px; font-size:0.8rem; color:#666; font-family:'Space Mono'; text-align:right;"></div>
        </div>

        <a href="https://discord.gg/Vc7fjmbXAe" target="_blank" class="discord-btn">
            <i class="fab fa-discord"></i> Open Ticket to Claim
        </a>

        <a href="index.html" class="back-link">Return to Shop</a>
    </div>

    <script>
        window.addEventListener('load', () => {
            // 1. CREATE CONFETTI
            function createConfetti() {
                for(let i=0; i<50; i++) {
                    const c = document.createElement('div');
                    c.className = 'confetti';
                    c.style.left = Math.random() * 100 + 'vw';
                    c.style.backgroundColor = Math.random() > 0.5 ? '#00ff88' : '#ffffff';
                    c.style.animationDelay = Math.random() * 2 + 's';
                    c.style.opacity = Math.random();
                    document.body.appendChild(c);
                    setTimeout(() => c.remove(), 4000);
                }
            }
            createConfetti();

            // 2. RETRIEVE DATA
            let pending = JSON.parse(localStorage.getItem('mtpPendingOrder'));
            const user = JSON.parse(localStorage.getItem('tps_discord_user'));
            
            // --- FAILSAFE: If no pending order, check if cart exists and build one ---
            if (!pending || !pending.items) {
                const fallbackCart = JSON.parse(localStorage.getItem('mtpCart'));
                if (fallbackCart && fallbackCart.length > 0) {
                    pending = {
                        items: fallbackCart,
                        total: "PAID",
                        date: new Date().toLocaleDateString('en-GB'),
                        id: "ORD-" + Math.floor(100000 + Math.random() * 900000),
                        status: "COMPLETED"
                    };
                }
            }
            // ---------------------------------------------------------------------

            const container = document.getElementById('itemsContainer');
            const totalEl = document.getElementById('orderTotal');
            const dateEl = document.getElementById('orderDate');
            const idEl = document.getElementById('orderIdDisplay');

            if (pending && pending.items) {
                // RENDER RECEIPT
                pending.items.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'order-item';
                    itemDiv.innerHTML = `
                        <span class="item-name">${item.qty}x ${item.title}</span>
                        <span class="item-price">${item.price}</span>
                    `;
                    container.appendChild(itemDiv);
                });

                totalEl.innerText = pending.total;
                dateEl.innerText = pending.date || new Date().toLocaleDateString('en-GB');
                if(pending.id) idEl.innerText = "ORDER ID: " + pending.id;

                // 3. SAVE TO HISTORY (CRITICAL STEP)
                // Set status to COMPLETED so it shows green in the table
                pending.status = "COMPLETED";

                if (user && user.id) {
                    // Get existing history for THIS user
                    let userHistory = JSON.parse(localStorage.getItem('tps_orders_' + user.id)) || [];
                    
                    // Prevent duplicate saves (check by ID)
                    const exists = userHistory.find(o => o.id === pending.id);
                    
                    if (!exists) {
                        userHistory.unshift(pending); // Add new order to top
                        localStorage.setItem('tps_orders_' + user.id, JSON.stringify(userHistory));
                        console.log("Order saved to history for user " + user.id);
                    }
                } else {
                    console.log("No user logged in, order not saved to profile history.");
                }

                // 4. CLEAR CART
                localStorage.removeItem('mtpCart');
                // We keep 'mtpPendingOrder' briefly so a refresh doesn't error out, 
                // but usually you might clear it too. We'll leave it for receipt persistence on reload.
                
            } else {
                container.innerHTML = '<p style="color:#666; font-style:italic;">No recent order found.</p>';
            }
        });
    </script>
</body>
</html>
